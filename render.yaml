# PiyuX Cloud — Render Blueprint
# For the free Render web service. No persistent disk is configured.
services:
  - type: web
    name: piyux-cloud
    runtime: node
    plan: free
    rootDir: Drive
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PUBLIC_URL
        sync: false
      - key: API_PRESETS
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "2147483648"
